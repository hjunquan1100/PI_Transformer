# : directory,  ckpt/contrastive_roberta
experiment_name: 'full_contrastive_pretrain'
metrics_json_path: 'experiments/results/contrastive_full.json'

# data/pretrain.csv ; items __getitem__  RDKit .current **100 **  (, ).
#  A40+ CPU: 5 epoch x ~65 min/epoch about   ( batch_size / num_workers ). null ().
max_contrastive_samples: 1000000
subsample_seed: 42

mlm_checkpoint: 'ckpt/pretrain.pt'
save_path: 'ckpt/experiments/full/contrastive_roberta'
pretrain_csv: 'data/pretrain.csv'

tokenizer_path: 'roberta-base'
add_vocab_flag: False
vocab_sup_file: 'data/vocab/vocab_sup_PE_I.csv'

blocksize: 175
# A40  64/128 ( RDKit  GPU )
batch_size: 64
epochs: 5
lr_rate: 0.00003
weight_decay: 0.01
warmup_ratio: 0.05
temperature: 0.1
proj_dim: 128
freeze_encoder_layers: 0
aug_indicator: 4
#  CPU ; DataLoader  max 3 
num_workers: 3
prefetch_factor: 4
persistent_workers: true
hidden_dropout_prob: 0.1
attention_probs_dropout_prob: 0.1
